[build-system]
requires = [
    "hatchling==1.27.0",
    "hatch-vcs==0.5.0",
    "livingproof-common @ https://github.com/Living-Proof-Labs/livingproof-common/releases/download/v1.0.0/livingproof_common-1.0.0-py3-none-any.whl#sha256=8b7795748b54eeb89610f3716245f45db48ac0474465a5abbf974e7075c1476c",
]
build-backend = "hatchling.build"

[project]
name = "livingproof-health"
dynamic = ["version"]
description = "Robot wellness and health observation CLI plugin for Living Proof Labs."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "livingproof-common==1.0.0",
    "click==8.5.0",
    "mcap==1.3.0",
]

[project.scripts]
livingproof-health = "livingproof_health.cli:health"

[project.entry-points."livingproof.capability.commands"]
health = "livingproof_health.cli:health"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "livingproof-evaluator-scenario",
    "pytest==8.4.2",
    "ruff==0.14.2",
]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.12" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.uv.sources]
livingproof-common = { url = "https://github.com/Living-Proof-Labs/livingproof-common/releases/download/v1.0.0/livingproof_common-1.0.0-py3-none-any.whl" }
livingproof-evaluator-scenario = { git = "https://github.com/Living-Proof-Labs/livingproof-evaluator-scenario", rev = "v1.3.8" }
