# Requires uv, project Python, pyproject.toml, and uv.lock with Ruff and pytest in dev.
# Run directly in the prepared development environment or development container, or use
# the dev:* tasks from a host with Docker and Compose.
version: "3"

tasks:
  setup:
    desc: Sync locked dependencies into the project environment
    cmds:
      - uv sync --locked --no-python-downloads
  check:
    desc: Check Python with locked Ruff
    cmds:
      - uv run --locked --no-sync --no-python-downloads ruff check .
      - uv run --locked --no-sync --no-python-downloads ruff format --check .
  test:
    desc: Run locked pytest
    cmds:
      - uv run --locked --no-sync --no-python-downloads python -c "import os; os.makedirs('artifacts', exist_ok=True)"
      - uv run --locked --no-sync --no-python-downloads pytest --junitxml=artifacts/tests.xml
  verify:
    desc: Run checks and tests
    cmds:
      - task: check
      - task: test
  dev:build:
    platforms: [linux]
    desc: Build the shared Docker development target
    cmds:
      - docker compose build development
  dev:verify:
    platforms: [linux]
    desc: Run setup and all tests, including installed host CLI integration, in Docker
    cmds:
      - docker compose run --rm --user "$(id -u):$(id -g)" -e LIVINGPROOF_NETWORK=1 development bash -c 'task setup && task verify'
  dev:shell:
    platforms: [linux]
    desc: Open the development container and set up its environment
    interactive: true
    cmds:
      - docker compose run --rm --user "$(id -u):$(id -g)" development bash -c 'task setup && exec bash'
