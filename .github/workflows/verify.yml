# SPDX-License-Identifier: Apache-2.0
# Build the unpublished development image locally until registry publication (#4).
# Adversarial cases run only inside this memory/time-constrained Docker environment.
name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            actionlint_archive: actionlint_1.7.12_linux_amd64.tar.gz
            actionlint_sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          - architecture: arm64
            runner: ubuntu-24.04-arm
            actionlint_archive: actionlint_1.7.12_linux_arm64.tar.gz
            actionlint_sha256: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history and tags so hatch-vcs and provenance read release tags.
          fetch-depth: 0
          fetch-tags: true
      - name: Build local test image
        run: docker build --target development -t health-test .
      - name: Prepare dependencies inside constrained Docker
        run: |
          mkdir -p "$RUNNER_TEMP/health-deps"
          docker run --rm --memory=512m --memory-swap=512m --cpus=2 --pids-limit=128 \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace/health" -v "$RUNNER_TEMP/health-deps:/tmp" health-test \
            timeout --kill-after=5 300 bash tools/review/prepare.sh
      - name: Verify offline inside constrained Docker
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker run --rm --network=none --memory=512m --memory-swap=512m --cpus=2 --pids-limit=128 \
            --user "$(id -u):$(id -g)" -e REVIEW_HEAD \
            -v "$PWD:/workspace/health" -v "$RUNNER_TEMP/health-deps:/tmp" health-test \
            timeout --kill-after=5 300 bash tools/review/verify.sh
      - name: Retain reconstructed review probes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reconstructed-review-${{ matrix.architecture }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/review-zstd/
            artifacts/review-zstd-command.log
          retention-days: 30
          if-no-files-found: error
      - name: Publish test results
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Health tests (${{ matrix.architecture }})
          path: artifacts/tests.xml
          reporter: java-junit
          use-actions-summary: "true"
          fail-on-error: "true"
          fail-on-empty: "true"
      - name: JUnit gate and completed check run
        id: report
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLISH_CHECK: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          docker run --rm --memory=512m --memory-swap=512m --cpus=2 --pids-limit=128 \
            --user "$(id -u):$(id -g)" \
            -e GITHUB_TOKEN -e GITHUB_REPOSITORY -e HEAD_SHA -e PUBLISH_CHECK \
            -e GITHUB_OUTPUT -e GITHUB_STEP_SUMMARY \
            -v "$PWD:/workspace/health" -v "$RUNNER_TEMP:$RUNNER_TEMP" health-test \
            timeout --kill-after=5 60 python tools/test_results.py \
              --name "Health tests (${{ matrix.architecture }})" --path artifacts/tests.xml --publish-check "$PUBLISH_CHECK"
      - name: Retain the JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-report-${{ matrix.architecture }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/tests.xml
            artifacts/bounds/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Health tests (${{ matrix.architecture }})"
            echo "Passed: ${{ steps.report.outputs.passed }}"
            echo "Failed: ${{ steps.report.outputs.failed }}"
            echo "Skipped: ${{ steps.report.outputs.skipped }}"
            echo "Check: ${{ steps.report.outputs.url_html || 'Not published (see JUnit gate)' }}"
            echo "Raw JUnit report retained for 30 days as artifact junit-report-${{ matrix.architecture }}-${{ github.event.pull_request.head.sha || github.sha }}."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: actionlint
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_ARCHIVE: ${{ matrix.actionlint_archive }}
          ACTIONLINT_SHA256: ${{ matrix.actionlint_sha256 }}
        run: |
          docker run --rm --memory=512m --memory-swap=512m --cpus=2 --pids-limit=128 \
            --user "$(id -u):$(id -g)" -e ACTIONLINT_ARCHIVE -e ACTIONLINT_SHA256 \
            -v "$PWD:/workspace/health:ro" health-test timeout --kill-after=5 60 bash -ec '
              curl -fsSL -o "/tmp/$ACTIONLINT_ARCHIVE" \
                "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$ACTIONLINT_ARCHIVE"
              echo "$ACTIONLINT_SHA256  /tmp/$ACTIONLINT_ARCHIVE" | sha256sum -c -
              tar -xzf "/tmp/$ACTIONLINT_ARCHIVE" -C /tmp actionlint
              /tmp/actionlint -color'
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASES_ENABLED == 'true'
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v9.9.7
    with:
      draft-release: true
  publish:
    needs: release
    if: needs.release.outputs.draft-created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.git-tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Build local test image
        run: docker build --target development -t health-test .
      - name: Require the verified tag, then build and smoke the packages
        env:
          VERSION: ${{ needs.release.outputs.version }}
          RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
          VERIFIED_COMMIT: ${{ github.sha }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          docker run --rm --memory=512m --memory-swap=512m --cpus=2 --pids-limit=128 \
            --user "$(id -u):$(id -g)" \
            -e VERSION -e RELEASE_TAG -e VERIFIED_COMMIT -e SOURCE_COMMIT \
            -v "$PWD:/workspace/health" health-test \
            timeout --kill-after=5 300 bash -c \
            'python tools/release_check.py && task setup && task package && task smoke'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-packages
          path: dist/
          retention-days: 30
      - name: Resume matching draft assets, then publish once
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_CREATED: ${{ needs.release.outputs.draft-created }}
        run: |
          set -euo pipefail
          python3 tools/release_assets.py "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS
